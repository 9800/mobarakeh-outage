<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780" font-family="Vazirmatn, Tahoma, sans-serif">
  <rect width="360" height="780" fill="#f2f5f3"/>
  <path d="M0,0 h360 v140 q0,45 -45,45 h-270 q-45,0 -45,-45 z" fill="#006a49"/>
  <text x="180" y="66" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">⚡ خاموشی برق مبارکه</text>
  <text x="180" y="96" fill="#d9f2e6" font-size="12" text-anchor="middle">کاری از نیکان رایان قهنویه (نریمان)</text>
  <rect x="16" y="165" width="328" height="118" rx="22" fill="#ffffff" stroke="#dbe5df"/>
  <circle cx="320" cy="196" r="6" fill="#d32f2f"/>
  <text x="306" y="202" fill="#10201a" font-size="15" font-weight="bold" text-anchor="start">الان برق کجا قطعه؟</text>
  <rect x="32" y="220" width="296" height="46" rx="14" fill="#d9f2e6"/>
  <circle cx="308" cy="243" r="5" fill="#009066"/>
  <text x="294" y="249" fill="#006a49" font-size="14" font-weight="bold" text-anchor="start">برق وصل است</text>
  <text x="48" y="249" fill="#006a49" font-size="10" text-anchor="end">خاموشی بعدی: ساعت ۱۴ تا ۱۶ — گروه ۱۰</text>
  <rect x="16" y="299" width="328" height="150" rx="22" fill="#ffffff" stroke="#dbe5df"/>
  <text x="312" y="327" fill="#5c6f66" font-size="11" text-anchor="start">نام محله، خیابان، مکان یا شماره گروه</text>
  <rect x="96" y="340" width="232" height="46" rx="14" fill="#f2f5f3" stroke="#dbe5df"/>
  <text x="312" y="369" fill="#93a69c" font-size="12" text-anchor="start">مثلاً: ولیعصر، کرکوند یا ۱۲</text>
  <rect x="32" y="340" width="56" height="46" rx="14" fill="#006a49"/>
  <text x="60" y="369" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">استعلام</text>
  <rect x="32" y="398" width="110" height="36" rx="14" fill="none" stroke="#006a49"/>
  <text x="87" y="421" fill="#006a49" font-size="11" text-anchor="middle">به‌روزرسانی</text>
  <rect x="212" y="398" width="116" height="36" rx="18" fill="#d9f2e6"/>
  <text x="270" y="421" fill="#006a49" font-size="10" font-weight="bold" text-anchor="middle">۲۵ گروه / ۲۵۷ نشانی</text>
  <rect x="16" y="465" width="328" height="290" rx="22" fill="#ffffff" stroke="#dbe5df"/>
  <text x="312" y="497" fill="#10201a" font-size="15" font-weight="bold" text-anchor="start">📋 جدول خاموشی روز اعلامی</text>
  <text x="262" y="537" fill="#10201a" font-size="12" text-anchor="middle">ساعت ۱۰ تا ۱۲</text>
  <text x="40" y="537" fill="#5c6f66" font-size="11" text-anchor="end">گروه ۲، ۸، ۲۰، ۳۱</text>
  <line x1="32" y1="552" x2="328" y2="552" stroke="#eef2ef"/>
  <text x="262" y="582" fill="#10201a" font-size="12" text-anchor="middle">ساعت ۱۲ تا ۱۴</text>
  <text x="40" y="582" fill="#5c6f66" font-size="11" text-anchor="end">گروه ۱۲، ۲۲، ۳۰</text>
  <line x1="32" y1="597" x2="328" y2="597" stroke="#eef2ef"/>
  <text x="262" y="627" fill="#10201a" font-size="12" text-anchor="middle">ساعت ۱۴ تا ۶</text>
  <text x="40" y="627" fill="#5c6f66" font-size="11" text-anchor="end">گروه ۵، ۹، ۱۰، ۱۴، ۱۶، ۷، ۲۱</text>
  <line x1="32" y1="642" x2="328" y2="642" stroke="#eef2ef"/>
  <text x="262" y="672" fill="#10201a" font-size="12" text-anchor="middle">ساعت ۱۶ تا ۱۸</text>
  <text x="40" y="672" fill="#5c6f66" font-size="11" text-anchor="end">گروه ۱، ۴، ۷، ۸، ۱۳، ۸</text>
  <line x1="32" y1="687" x2="328" y2="687" stroke="#eef2ef"/>
  <text x="262" y="717" fill="#10201a" font-size="12" text-anchor="middle">ساعت ۱۸ تا ۲۰</text>
  <text x="40" y="717" fill="#5c6f66" font-size="11" text-anchor="end">گروه ۱۷</text>
</svg>
