name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare APK file
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Khamooshi-Bargh-Mobarakeh.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobarakeh-Outage-APK
          path: app/build/outputs/apk/debug/Khamooshi-Bargh-Mobarakeh.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "⚡ آخرین نسخه — خاموشی برق مبارکه"
          body: |
            آخرین نسخهٔ ساخته‌شدهٔ خودکار اپ «خاموشی برق مبارکه»

            📥 برای نصب: فایل APK زیر را دانلود و روی گوشی اندرویدی نصب کنید.
            ✅ کار روی اندروید ۵ به بالا (همهٔ گوشی‌ها)
            🔔 یادآوری با صدا و ویبره + نمایش روی صفحهٔ قفل
          files: app/build/outputs/apk/debug/Khamooshi-Bargh-Mobarakeh.apk
          prerelease: false
